name: Check community MQTT brokers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'catalog/brokers.json'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/check.yml'

permissions:
  contents: write

concurrency:
  group: community-mqtt-daily-check
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Validate catalog
        run: python -m unittest discover -s tests -v
      - name: Check public MQTT endpoints (subscribe only)
        run: python scripts/check_brokers.py --wait 25 --workers 6
      - name: Generate public directory
        run: python scripts/render.py
      - name: Commit daily status and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/status.json data/history.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(status): daily MQTT broker checks [skip ci]"
            git push
          fi
